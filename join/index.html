<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Join the Wayoni waitlist." />
  <link rel="canonical" href="https://mytrofanov.dev/join" />
  <link rel="icon" type="image/svg+xml" href="../public/favicon.png" />
  <link rel="stylesheet" href="../styles/main.css" />
  <script src="../components/site-header.js" defer></script>
  <title>Join Wayoni | Ivan Mytrofanov</title>
</head>
<body>
  <site-header></site-header>

  <main id="join">
    <section class="join-hero" aria-labelledby="join-title">
      <div class="join-copy">
        <p>wayoni waitlist</p>
        <h1 id="join-title">join</h1>
      </div>

      <form class="waitlist-form join-form">
        <label>
          name
          <input type="text" name="name" autocomplete="name" />
        </label>

        <label>
          email
          <input type="email" name="email" autocomplete="email" />
        </label>

        <label>
          note
          <textarea name="note" rows="4"></textarea>
        </label>

        <button type="button">save spot</button>
      </form>
    </section>
  </main>
</body>
</html>
