<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Wayoni - Ivan Mytrofanov project." />
  <link rel="canonical" href="https://mytrofanov.dev/wayoni" />
  <link rel="icon" type="image/svg+xml" href="../public/favicon.png" />
  <link rel="stylesheet" href="../styles/main.css" />
  <script src="../components/site-header.js" defer></script>
  <title>Wayoni | Ivan Mytrofanov</title>
</head>
<body>
  <site-header></site-header>

  <main id="wayoni">
    <section class="wayoni-hero" aria-labelledby="wayoni-title">
      <div class="wayoni-copy">
        <div class="wayoni-title-group">
          <p>Ivan Mytrofanov</p>
          <h1 id="wayoni-title">wayoni</h1>
          <div class="wayoni-actions">
            <span class="wayoni-slogan">search less. discover more.</span>
            <a class="waitlist-button" href="#waitlist-modal">join waitlist</a>
          </div>
        </div>
      </div>

      <div class="wayoni-side">
        <figure class="wayoni-mascot">
          <img src="../public/wayoni.png" alt="Wayoni mascot" />
        </figure>
      </div>
    </section>
  </main>

  <div class="waitlist-modal" id="waitlist-modal" role="dialog" aria-modal="true" aria-labelledby="waitlist-title">
    <a class="waitlist-modal__backdrop" href="#" aria-label="Close waitlist form"></a>

    <div class="waitlist-dialog">
      <a class="waitlist-close" href="#" aria-label="Close waitlist form">x</a>
      <h2 id="waitlist-title">join waitlist</h2>

      <form class="waitlist-form">
        <label>
          name
          <input type="text" name="name" autocomplete="name" />
        </label>

        <label>
          email
          <input type="email" name="email" autocomplete="email" />
        </label>

        <label>
          note
          <textarea name="note" rows="4"></textarea>
        </label>

        <button type="button">save spot</button>
      </form>
    </div>
  </div>
</body>
</html>
